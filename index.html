<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- meu titulo -->
    <h1><center>Consulta de clima</center></h1>

    <!-- aqui é para o usuario por o texto dentro da caixa de "digite uma cidade" -->
    <div class="pesquisa">

        <input
            type="text"
            id="cidade"
            aria-placeholder="digite uma cidade"
        >

        <!-- aqui é o botão buscar -->
        <button id="buscar">Buscar</button>

        <!-- aqui é o texto abaixo da barra de pesquisa -->
        <p id="mensagem">Digite sua cidade para consultar</p>

    </div>

</body>

</html>
